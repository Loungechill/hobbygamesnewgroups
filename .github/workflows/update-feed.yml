name: Update Hobby Games feed
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/update-feed.yml
      - scripts/build_feed.py
      - hobby_games_offer_labels.csv
      - hobbygames_sale_discounts.csv
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'
permissions:
  contents: write
concurrency:
  group: hobbygames-feed-main
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Generate feed
        run: python3 scripts/build_feed.py
      - name: Publish feed
        run: |
          git add hobbygames-sale.yml
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Update Hobby Games feed'
          git push origin HEAD:main
