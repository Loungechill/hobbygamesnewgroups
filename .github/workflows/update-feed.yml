          def norm(name):
              return re.sub(r"\s+", " ", unicodedata.normalize("NFKC", name).lower().replace("ё", "е")).strip()
          index = defaultdict(set)
          exact = defaultdict(set)
          current = {}
          commits = subprocess.check_output(["git", "log", "--format=%H", "--", "hobbygames-sale.yml"], text=True).splitlines()
          for sha in commits:
              xml = subprocess.check_output(["git", "show", sha + ":hobbygames-sale.yml"])
              for offer in ET.fromstring(xml).findall("./shop/offers/offer"):
                  oid, name = offer.get("id"), offer.findtext("name", "")
                  index[norm(name)].add(oid)
                  exact[name].add(oid)
          for offer in ET.parse("hobbygames-sale.yml").findall("./shop/offers/offer"):
              current[offer.get("id")] = offer.findtext("name", "")
          path = Path("hobby_games_offer_labels.csv")
          with path.open(encoding="utf-8-sig", newline="") as f:
              reader = csv.DictReader(f)
              fields = reader.fieldnames
              rows = list(reader)
          assert fields == ["offer_id", "custom_label_3", "custom_label_4"]
          table = {row["offer_id"]: dict(row) for row in rows}
          assert len(table) == len(rows)
          before = {oid: dict(row) for oid, row in table.items()}
          assignments = {}
          changes = 0
          for selection in selections:
              matched, missing, ambiguous, live = [], [], [], set()
              for name in selection["products"]:
                  candidates = exact.get(name) or index.get(norm(name), set())
                  if len(candidates) == 0:
                      missing.append(name)
                      continue
                  if len(candidates) != 1:
                      ambiguous.append([name, sorted(candidates)])
                      continue
                  oid = next(iter(candidates))
                  if oid in assignments:
                      assert assignments[oid] == selection["label"], (oid, assignments[oid], selection["label"])
                  assignments[oid] = selection["label"]
                  row = table.setdefault(oid, {"offer_id": oid, "custom_label_3": "base", "custom_label_4": "base"})
                  if row["custom_label_4"] == "exclude" and selection["label"] != "exclude":
                      continue
                  if row["custom_label_4"] != selection["label"]:
                      changes += 1
                  row["custom_label_4"] = selection["label"]
                  matched.append(oid)
                  if oid in current:
                      live.add(oid)
              print(json.dumps({"block": selection["block"], "label": selection["label"], "selected": len(selection["products"]), "matched": len(set(matched)), "live": len(live), "missing": missing, "ambiguous": ambiguous}, ensure_ascii=False))
          for oid, row in before.items():
              assert table[oid]["custom_label_3"] == row["custom_label_3"]
          assert len(table) >= len(before)
          temporary = path.with_suffix(".tmp")
          with temporary.open("w", encoding="utf-8", newline="") as f:
              writer = csv.DictWriter(f, fieldnames=fields)
              writer.writeheader()
              writer.writerows(table.values())
          temporary.replace(path)
          print("Corrected custom_label_4 assignments:", changes)
          PY
      - name: Generate feed
        run: python3 scripts/build_feed.py
      - name: Publish feed
        run: |
          git add hobby_games_offer_labels.csv hobbygames-sale.yml
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Update Hobby Games feed'
          git push origin HEAD:main
